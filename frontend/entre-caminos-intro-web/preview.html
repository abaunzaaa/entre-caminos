<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrada de Entre Caminos</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        background: #294841;
        color: #fffaec;
        font: 500 18px/1.5 Inter, system-ui, sans-serif;
      }
      main { text-align: center; }
      button {
        padding: 12px 22px;
        border: 1px solid rgb(255 250 236 / 55%);
        border-radius: 999px;
        background: rgb(255 255 255 / 10%);
        color: inherit;
        cursor: pointer;
        backdrop-filter: blur(8px);
      }
      .intro {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #fffaec;
        animation: exit 2.6s ease-in-out forwards;
      }
      .intro img {
        z-index: 1;
        width: clamp(180px, 25vw, 310px);
        filter: drop-shadow(0 18px 22px rgb(41 72 65 / 18%));
        animation: float 1.3s ease-in-out infinite alternate;
      }
      .glow {
        position: absolute;
        width: min(52vw, 540px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(circle, rgb(41 72 65 / 8%), transparent 67%);
        animation: breathe 1.3s ease-in-out infinite alternate;
      }
      @keyframes float {
        from { transform: translateY(8px) rotate(-2deg) scale(.985); }
        to { transform: translateY(-10px) rotate(2deg) scale(1.015); }
      }
      @keyframes breathe {
        from { opacity: .45; transform: scale(.94); }
        to { opacity: 1; transform: scale(1.06); }
      }
      @keyframes exit {
        0% { opacity: 0; visibility: visible; }
        12%, 78% { opacity: 1; }
        100% { opacity: 0; visibility: hidden; pointer-events: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Entre Caminos</h1>
      <p>La página aparece al finalizar la animación.</p>
      <button type="button" onclick="location.reload()">Repetir animación</button>
    </main>
    <div class="intro" role="status" aria-label="Cargando Entre Caminos">
      <div class="glow" aria-hidden="true"></div>
      <img src="key-icon-green.png" alt="" aria-hidden="true" />
    </div>
  </body>
</html>
